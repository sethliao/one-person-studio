name: Release

# 推 v* tag 就自动生成 Release。
# 说明文字优先取自 CHANGELOG.md 的对应版本段（真源），取不到再退回 GitHub 自动生成。
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 从 CHANGELOG 提取本版本说明
        id: notes
        run: |
          ver="${GITHUB_REF_NAME#v}"
          awk -v v="$ver" '
            $0 ~ "^## \\[" v "\\]"   { flag = 1; next }
            /^## \[/                 { flag = 0 }
            flag                     { print }
          ' CHANGELOG.md > /tmp/notes.md
          if [ -s /tmp/notes.md ]; then
            echo "fallback=false" >> "$GITHUB_OUTPUT"
            echo "✅ 已在 CHANGELOG.md 中找到 [$ver] 段落"
          else
            echo "fallback=true" >> "$GITHUB_OUTPUT"
            echo "⚠️ CHANGELOG.md 里没有 [$ver] 段落，改用 GitHub 自动生成"
          fi

      - name: 建 Release（说明来自 CHANGELOG）
        if: steps.notes.outputs.fallback == 'false'
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file /tmp/notes.md --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 建 Release（说明自动生成）
        if: steps.notes.outputs.fallback == 'true'
        run: gh release create "$GITHUB_REF_NAME" --generate-notes --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
